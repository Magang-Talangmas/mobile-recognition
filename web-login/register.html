<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new account for our secure portal.">
    <title>Create Account | Secure Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob shape-1"></div>
        <div class="blob shape-2"></div>
    </div>
    
    <div class="container">
        <div class="login-card">
            <div class="card-header">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="#8a2be2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="8.5" cy="7" r="4" stroke="#8a2be2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="20" y1="8" x2="20" y2="14" stroke="#8a2be2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="23" y1="11" x2="17" y2="11" stroke="#8a2be2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2>Create Account</h2>
                <p>Join us today to get started</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullName" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="name@company.com" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="primary-btn">
                    <span>Sign Up</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 5L19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
            
            <div class="divider">
                <span>Or sign up with</span>
            </div>
            
            <div class="social-login">
                <button class="social-btn" aria-label="Sign up with Google">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.37 10H12V14.26H17.93C17.67 15.63 16.9 16.81 15.74 17.58V20.31H19.29C21.37 18.4 22.56 15.6 22.56 12.25Z" fill="#4285F4"/>
                        <path d="M12 23C14.97 23 17.46 22.02 19.29 20.31L15.74 17.58C14.75 18.24 13.48 18.66 12 18.66C9.14 18.66 6.71 16.73 5.84 14.16H2.17V17.01C3.99 20.61 7.7 23 12 23Z" fill="#34A853"/>
                        <path d="M5.84 14.16C5.62 13.49 5.49 12.76 5.49 12C5.49 11.24 5.62 10.51 5.84 9.84V6.99H2.17C1.42 8.49 1 10.2 1 12C1 13.8 1.42 15.51 2.17 17.01L5.84 14.16Z" fill="#FBBC05"/>
                        <path d="M12 5.34C13.62 5.34 15.06 5.9 16.2 6.99L19.38 3.82C17.45 2.02 14.97 1 12 1C7.7 1 3.99 3.39 2.17 6.99L5.84 9.84C6.71 7.27 9.14 5.34 12 5.34Z" fill="#EA4335"/>
                    </svg>
                </button>
                <button class="social-btn" aria-label="Sign up with GitHub">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12C2 16.418 4.873 20.169 8.841 21.5C9.341 21.593 9.528 21.282 9.528 21.018C9.528 20.782 9.52 19.982 9.516 18.91C6.734 19.514 6.147 17.568 6.147 17.568C5.693 16.417 5.038 16.11 5.038 16.11C4.133 15.492 5.106 15.504 5.106 15.504C6.108 15.574 6.634 16.536 6.634 16.536C7.525 18.061 8.969 17.62 9.544 17.362C9.635 16.702 9.9 16.262 10.194 16.014C7.973 15.762 5.637 14.904 5.637 11.472C5.637 10.495 5.986 9.693 6.556 9.056C6.464 8.804 6.155 7.892 6.643 6.666C6.643 6.666 7.391 6.427 9.516 7.868C10.226 7.671 10.985 7.573 11.737 7.569C12.488 7.573 13.247 7.671 13.959 7.868C16.082 6.427 16.828 6.666 16.828 6.666C17.319 7.892 17.009 8.804 16.918 9.056C17.491 9.693 17.838 10.495 17.838 11.472C17.838 14.914 15.498 15.759 13.269 16.002C13.639 16.321 13.972 16.953 13.972 17.925C13.972 19.317 13.96 20.44 13.96 20.782C13.96 21.047 14.14 21.36 14.64 21.267C18.618 19.897 21.5 16.148 21.5 11.733C21.5 6.477 17.023 2 12 2Z" fill="#fff"/>
                    </svg>
                </button>
            </div>
            
            <div class="signup-link">
                Already have an account? <a href="index.html">Sign in here</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
