plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.example.javatraining'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    def envProperties = new Properties()
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def parts = line.split('=', 2)
            if (parts.length == 2 && !line.startsWith("#")) {
                envProperties.setProperty(parts[0].trim(), parts[1].trim())
            }
        }
    }

    defaultConfig {
        applicationId "com.example.javatraining"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
        
        def supabaseUrl = envProperties.getProperty("SUPABASE_URL", "https://your-project.supabase.co/rest/v1/")
        if (!supabaseUrl.endsWith("/")) {
            supabaseUrl += "/"
        }
        buildConfigField("String", "SUPABASE_URL", "\"${supabaseUrl}\"")

        def supabaseAnonKey = envProperties.getProperty("SUPABASE_ANON_KEY", "your-anon-key")
        buildConfigField("String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\"")

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { instr ->
                localProperties.load(instr)
            }
        }
        def apiBaseUrl = localProperties.getProperty("API_BASE_URL", "\"http://10.0.2.2:3000/api/v1/\"").replace("\"", "")
        if (!apiBaseUrl.endsWith("/")) {
            apiBaseUrl += "/"
        }
        buildConfigField("String", "API_BASE_URL", "\"${apiBaseUrl}\"")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Lifecycle
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    
    // Room
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    
    // Retrofit
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.gson
    
    // Glide
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    
    // CameraX
    implementation libs.camerax.core
    implementation libs.camerax.camera2
    implementation libs.camerax.lifecycle
    implementation libs.camerax.view
    
    // ML Kit Face Detection
    implementation 'com.google.mlkit:face-detection:16.1.6'
    
    // WorkManager
    implementation libs.work.runtime
    
    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    
    // Lottie
    implementation 'com.airbnb.android:lottie:6.1.0'
}